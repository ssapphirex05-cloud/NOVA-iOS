name: Upload NOVA to TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode 26+
        run: |
          xcodebuild -version
          MAJOR=$(xcodebuild -version | awk '/Xcode/{split($2,a,"."); print a[1]; exit}')
          test "$MAJOR" -ge 26

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate icons
        run: python3 scripts/generate_icons.py

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64"
          mkdir -p NOVA/Resources
          python3 -c 'import os,base64,pathlib; pathlib.Path("NOVA/Resources/GoogleService-Info.plist").write_bytes(base64.b64decode(os.environ["GOOGLE_SERVICE_INFO_PLIST_BASE64"]))'

      - name: Install Apple Distribution certificate
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/nova-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/nova_distribution.p12"
          export CERT_PATH
          python3 -c 'import os,base64,pathlib; pathlib.Path(os.environ["CERT_PATH"]).write_bytes(base64.b64decode(os.environ["APPLE_DISTRIBUTION_P12_BASE64"]))'
          security create-keychain -p "nova-ci" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "nova-ci" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_DISTRIBUTION_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "nova-ci" "$KEYCHAIN_PATH"

      - name: Restore App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          export API_KEY_PATH
          python3 -c 'import os,base64,pathlib; pathlib.Path(os.environ["API_KEY_PATH"]).write_bytes(base64.b64decode(os.environ["APP_STORE_CONNECT_API_KEY_P8_BASE64"]))'
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive for TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild             -project NOVA-iOS.xcodeproj             -scheme NOVA             -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$RUNNER_TEMP/NOVA.xcarchive"             DEVELOPMENT_TEAM="$APPLE_TEAM_ID"             CODE_SIGN_STYLE=Automatic             -allowProvisioningUpdates             -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"             -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"             -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"             clean archive

      - name: Export IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild             -exportArchive             -archivePath "$RUNNER_TEMP/NOVA.xcarchive"             -exportPath "$RUNNER_TEMP/export"             -exportOptionsPlist ExportOptions-TestFlight.plist             -allowProvisioningUpdates             -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"             -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"             -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          xcrun altool             --upload-app             --type ios             --file "$IPA"             --apiKey "$APP_STORE_CONNECT_KEY_ID"             --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Preserve IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-iOS-1.0.1-TestFlight
          path: ${{ runner.temp }}/export/*.ipa
